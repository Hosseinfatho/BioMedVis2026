name: Deploy GitHub Pages

on:
  push:
    branches: [gitpage]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare static topology (PDB)
        run: npm run prepare:pages-data

      - name: Build for GitHub Pages
        run: npm run build:pages
        env:
          VITE_BASE_PATH: /BioMedVis2026/

      - name: SPA fallback for GitHub Pages
        run: cp dist-pages/index.html dist-pages/404.html

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist-pages
          branch: gh-pages
          clean: true
          single-commit: true
